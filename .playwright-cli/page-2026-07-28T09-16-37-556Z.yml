            - heading "Giả định" [level=3] [ref=e549]
            - list [ref=e550]:
              - listitem [ref=e777]: Thủy văn, diễn toán hồ chứa và ngập lụt là đầu ra tổng hợp dùng để trình diễn.
              - listitem [ref=e778]: Ngập vượt nền là độ sâu nước mô hình cao hơn trường sông bình thường.
              - listitem [ref=e779]: Ngập vượt nền được tham chiếu theo trường sông bình thường của mô hình.
              - listitem [ref=e780]: Độ sâu là toàn bộ cột nước mô hình, không phải phần ngập vượt trên sông bình thường.
              - listitem [ref=e781]: Cao độ DEM toàn cầu và lòng dẫn khắc tổng hợp chỉ đủ cho hiển thị và truy vấn trạng thái trình diễn.
              - listitem [ref=e782]: Trạng thái đối tượng do bản trình diễn tất định trong trình duyệt tạo ra.
          - region [ref=e556]:
            - heading "Giới hạn" [level=3] [ref=e557]
            - list [ref=e558]:
              - listitem [ref=e783]: Chưa được hiệu chỉnh hoặc kiểm định cho vận hành thực tế.
              - listitem [ref=e784]: Địa hình không phải địa hình đáy khảo sát; lòng dẫn có phần khắc tổng hợp.
              - listitem [ref=e785]: Vận tốc, động lượng, thời gian nước đến và phân bổ nguồn chưa phải đầu ra vật lý được hỗ trợ.
              - listitem [ref=e786]: Mô hình trình duyệt tổng hợp; chưa được hiệu chỉnh hoặc kiểm định cho vận hành.
              - listitem [ref=e787]: Chưa có mô hình bất định hoặc sai số được kiểm định.
              - listitem [ref=e788]: Không phải địa hình đáy được khảo sát.
              - listitem [ref=e789]: Mốc cao độ nguồn chưa được chuẩn hóa về mốc lưu vực vận hành.
              - listitem [ref=e790]: Không được dùng hoạt ảnh, hạt hiển thị hoặc trạng thái shader làm nguồn số liệu.
              - listitem [ref=e791]: Mốc mực hồ và đường quan hệ dung tích chưa phải dữ liệu vận hành được quản trị.
